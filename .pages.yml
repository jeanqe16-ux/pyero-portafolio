# Dos destinos de subida. Las imágenes van a src/media para que Astro las optimice (AVIF y WebP por tamaño);
# los videos y los logos van a public/media y se sirven tal cual. En ambos casos la ruta guardada es /media/...
media:
  - name: imagenes
    label: Imágenes (se optimizan)
    input: src/media
    output: /media
  - name: publico
    label: Videos y logos (sin optimizar)
    input: public/media
    output: /media

# Los campos que terminan en _en son la versión en inglés; si se dejan vacíos se usa el español.
content:
  - name: site
    label: Datos del sitio
    type: file
    path: src/data/site.json
    fields:
      - { name: marca, label: Nombre de la marca, type: string }
      - { name: marcaSufijo, label: Parte del nombre en naranja, type: string }
      - { name: url, label: 'Dirección pública del sitio (con https, sin barra final)', type: string }
      - name: persona
        label: Persona
        type: object
        fields:
          - { name: nombre, label: Nombre, type: string }
          - { name: cargo, label: Cargo, type: string }
          - { name: cargo_en, label: Cargo (inglés), type: string }
      - name: ubicacion
        label: Ubicación
        type: object
        fields:
          - { name: ciudad, label: Ciudad, type: string }
          - { name: region, label: Región, type: string }
          - { name: pais, label: 'País (código de dos letras)', type: string }
      - { name: whatsapp, label: 'WhatsApp (con código de país, sin +)', type: string }
      - { name: mensajeWhatsapp, label: Mensaje prellenado de WhatsApp, type: text }
      - { name: mensajeWhatsapp_en, label: Mensaje prellenado de WhatsApp (inglés), type: text }
      - { name: instagram, label: Enlace de Instagram, type: string }
      - { name: tiktok, label: Enlace de TikTok, type: string }
      - name: seo
        label: SEO
        type: object
        fields:
          - { name: titulo, label: Título de la página, type: string }
          - { name: titulo_en, label: Título de la página (inglés), type: string }
          - { name: descripcion, label: Descripción, type: text }
          - { name: descripcion_en, label: Descripción (inglés), type: text }
          - { name: imagen, label: Imagen al compartir (1200x630), type: image, options: { media: publico } }
          - { name: imagen_en, label: Imagen al compartir en inglés (1200x630), type: image, options: { media: publico } }
          - { name: imagenAlt, label: Descripción de la imagen al compartir, type: string }
          - { name: imagenAlt_en, label: Descripción de la imagen al compartir (inglés), type: string }

  - name: cifras
    label: Cifras de trabajo
    type: file
    path: src/data/cifras.json
    fields:
      - name: cifras
        label: Cifras
        type: object
        list: true
        fields:
          - { name: prefijo, label: 'Prefijo opcional, por ejemplo +', type: string }
          - { name: valor, label: Número, type: string }
          - { name: etiqueta, label: Texto, type: string }
          - { name: etiqueta_en, label: Texto (inglés), type: string }

  - name: casos
    label: Casos de estudio
    type: file
    path: src/data/casos.json
    fields:
      - name: casos
        label: Casos
        type: object
        list: true
        fields:
          - { name: cliente, label: 'Identificador del cliente (el de Clientes)', type: string, required: true }
          - { name: categoria, label: Categoría (rótulo del reel), type: string }
          - { name: categoria_en, label: Categoría (inglés), type: string }
          - { name: reto, label: Reto, type: text }
          - { name: reto_en, label: Reto (inglés), type: text }
          - { name: hice, label: Lo que hice, type: text }
          - { name: hice_en, label: Lo que hice (inglés), type: text }
          - { name: resultado, label: 'Resultado (cualitativo, sin cifras inventadas)', type: text }
          - { name: resultado_en, label: Resultado (inglés), type: text }
          - name: videos
            label: 'Videos (el primero es también el reel del inicio)'
            type: object
            list: true
            fields:
              - { name: titulo, label: Título, type: string }
              - { name: video, label: 'Video (vertical 1080x1920)', type: file, options: { extensions: [mp4, webm], media: publico } }
              - { name: poster, label: Portada, type: image }

  - name: clientes
    label: Clientes y logos de la franja
    type: file
    path: src/data/clientes.json
    fields:
      - name: clientes
        label: Clientes
        type: object
        list: true
        fields:
          - { name: id, label: 'Identificador (igual al de su carpeta en media)', type: string, required: true }
          - { name: nombre, label: Nombre, type: string, required: true }
          - { name: logo, label: 'Logo (PNG transparente, se muestra en blanco)', type: image, options: { media: publico } }

  - name: creadores
    label: Creadores
    type: file
    path: src/data/creadores.json
    fields:
      - name: creadores
        label: Creadores
        type: object
        list: true
        fields:
          - { name: handle, label: Handle, type: string, required: true }
          - { name: enlace, label: Enlace a su perfil, type: string }
          - { name: categoria, label: Categoría, type: string }
          - { name: categoria_en, label: Categoría (inglés), type: string }
          - { name: video, label: 'Reel (vertical 1080x1920)', type: file, options: { extensions: [mp4, webm], media: publico } }
          - { name: poster, label: Portada del reel, type: image }

  - name: servicios
    label: Servicios
    type: file
    path: src/data/servicios.json
    fields:
      - name: servicios
        label: Servicios
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string, required: true }
          - { name: titulo_en, label: Título (inglés), type: string }
          - { name: texto, label: Texto, type: text }
          - { name: texto_en, label: Texto (inglés), type: text }
          - { name: ideal, label: Ideal para, type: string }
          - { name: ideal_en, label: Ideal para (inglés), type: string }
          - name: icono
            label: Icono
            type: select
            options:
              values: [video, animacion, diseno]
          - name: media
            label: Qué muestra la tarjeta
            type: select
            options:
              values: [video, posts]
          - { name: video, label: 'Video en loop (cuadrado, sin audio)', type: file, options: { extensions: [mp4, webm], media: publico } }
          - { name: poster, label: Portada del video, type: image, options: { media: publico } }

  - name: diseno
    label: Posts y portadas por cliente
    type: file
    path: src/data/diseno.json
    fields:
      - name: posts
        label: Posts
        type: object
        list: true
        fields:
          - { name: cliente, label: Identificador del cliente, type: string, required: true }
          - { name: titulo, label: Título, type: string, required: true }
          - { name: imagenes, label: 'Imágenes (más de una forma un carrusel)', type: image, list: true }
      - name: portadas
        label: Portadas
        type: object
        list: true
        fields:
          - { name: cliente, label: Identificador del cliente, type: string, required: true }
          - { name: titulo, label: Título, type: string, required: true }
          - { name: imagen, label: Imagen, type: image }
          - { name: ancho, label: Ancho en px, type: number }
          - { name: alto, label: Alto en px, type: number }

  - name: proceso
    label: Proceso
    type: file
    path: src/data/proceso.json
    fields:
      - name: pasos
        label: Pasos
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string, required: true }
          - { name: titulo_en, label: Título (inglés), type: string }
          - { name: texto, label: Texto, type: text }
          - { name: texto_en, label: Texto (inglés), type: text }

  - name: herramientas
    label: Herramientas
    type: file
    path: src/data/herramientas.json
    fields:
      - name: herramientas
        label: Herramientas
        type: object
        list: true
        fields:
          - { name: nombre, label: Nombre, type: string, required: true }
          - { name: sigla, label: 'Sigla del logo (vacío usa el símbolo de CapCut)', type: string }
          - { name: color, label: 'Color de marca (hex)', type: string }
          - { name: brillo, label: 'Color del resplandor (hex)', type: string }

  - name: textos
    label: Textos del sitio
    type: file
    path: src/data/textos.json
    fields:
      - name: es
        label: Español
        type: object
        fields: &textos
          - name: nav
            label: Menú
            type: object
            fields:
              - { name: casos, label: Casos, type: string }
              - { name: servicios, label: Servicios, type: string }
              - { name: sobre, label: Sobre mí, type: string }
              - { name: contacto, label: Contacto, type: string }
              - { name: cta, label: Botón, type: string }
              - { name: idioma, label: Descripción del selector de idioma, type: string }
          - name: hero
            label: Inicio
            type: object
            fields:
              - { name: estado, label: Etiqueta de disponibilidad, type: string }
              - name: titulo
                label: Titular
                type: object
                fields:
                  - { name: a, label: Primera parte, type: string }
                  - { name: b, label: Primera palabra en naranja, type: string }
                  - { name: b2, label: Texto que sigue a la primera palabra en naranja, type: string }
                  - { name: c, label: Segunda parte, type: string }
                  - { name: d, label: Segunda palabra en naranja, type: string }
              - { name: bajada, label: Subtítulo, type: text }
              - { name: cta, label: Botón de WhatsApp, type: string }
              - { name: secundario, label: Botón secundario, type: string }
              - { name: proximamente, label: Texto de reel sin video, type: string }
          - name: prueba
            label: Cifras
            type: object
            fields:
              - { name: etiqueta, label: Descripción para lectores de pantalla, type: string }
              - { name: pendiente, label: Marcador cuando falta la cifra, type: string }
          - name: franja
            label: Franja de marcas
            type: object
            fields:
              - { name: etiqueta, label: Descripción para lectores de pantalla, type: string }
          - name: casos
            label: Casos de estudio
            type: object
            fields:
              - { name: etiqueta, label: Etiqueta, type: string }
              - name: titulo
                label: Titular
                type: object
                fields: &titular
                  - { name: antes, label: Antes de la palabra en naranja, type: string }
                  - { name: destacado, label: Palabra en naranja, type: string }
                  - { name: despues, label: Después de la palabra en naranja, type: string }
              - { name: caso, label: Palabra Caso, type: string }
              - { name: reto, label: Título Reto, type: string }
              - { name: hice, label: Título Lo que hice, type: string }
              - { name: resultado, label: Título Resultado, type: string }
              - { name: verVideo, label: Texto Ver video, type: string }
              - { name: verImagen, label: Texto Ver en grande, type: string }
              - { name: piezas, label: Texto Piezas de, type: string }
          - name: servicios
            label: Servicios
            type: object
            fields:
              - { name: etiqueta, label: Etiqueta, type: string }
              - { name: titulo, label: Titular, type: object, fields: *titular }
              - { name: subtitulo, label: Subtítulo, type: text }
              - { name: idealPara, label: Texto Ideal para, type: string }
              - { name: proximamente, label: Texto de video pendiente, type: string }
              - { name: ctaProyectos, label: Botón Ver casos, type: string }
              - { name: ctaCotizar, label: Botón Cotizar, type: string }
              - { name: pase, label: Descripción del pase de posts, type: string }
          - name: proceso
            label: Proceso
            type: object
            fields:
              - { name: etiqueta, label: Etiqueta, type: string }
              - { name: titulo, label: Titular, type: object, fields: *titular }
          - name: sobre
            label: Sobre mí
            type: object
            fields:
              - { name: etiqueta, label: Etiqueta, type: string }
              - { name: titulo, label: Titular, type: object, fields: *titular }
              - { name: parrafos, label: Párrafos, type: text, list: true }
              - { name: herramientas, label: Título de herramientas, type: string }
              - { name: fotoAlt, label: Descripción de la foto, type: string }
              - { name: cta, label: Botón, type: string }
              - { name: ctaSecundario, label: Enlace secundario, type: string }
          - name: contacto
            label: Cierre
            type: object
            fields:
              - { name: etiqueta, label: Etiqueta, type: string }
              - name: titulo
                label: Pregunta
                type: object
                fields:
                  - { name: antes, label: Antes de la palabra en naranja, type: string }
                  - { name: destacado, label: Palabra en naranja, type: string }
                  - { name: cierre, label: Signo de cierre, type: string }
              - { name: texto, label: Texto, type: text }
              - { name: cta, label: Botón de WhatsApp, type: string }
              - { name: redes, label: Texto junto a las redes, type: string }
          - name: cursor
            label: Rótulos del cursor
            type: object
            fields:
              - { name: play, label: Sobre videos, type: string }
              - { name: ver, label: Sobre casos, type: string }
          - name: perdida
            label: Página 404
            type: object
            fields:
              - { name: codigo, label: Etiqueta, type: string }
              - { name: titulo, label: Titular, type: string }
              - { name: texto, label: Texto, type: text }
              - { name: juego, label: Descripción del mini juego, type: string }
              - { name: marcador, label: Texto del marcador, type: string }
              - { name: volver, label: Botón, type: string }
          - { name: pie, label: Texto del pie, type: string }
          - { name: whatsapp, label: Descripción del botón flotante, type: string }
          - { name: pixeles, label: 'Palabras que forman los pixeles (mayúsculas, sin tildes)', type: string, list: true }
      - name: en
        label: Inglés
        type: object
        fields: *textos
